[project]
name = "kivyx"
version = "0.1.0.dev0"
description = "A new set of Kivy widgets that aims for better touch experience"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nattosai Mito", email = "flow4re2c@gmail.com" }
]
keywords = ["kivy"]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<4"
dependencies = [
    "asynckivy>=0.12.1",
    "kivy",
    "kivy-garden-pyle>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
doc = [
    "sphinx>=9.0.4",
]

[tool.pytest]
xfail_strict = true
addopts = ["--maxfail=4", "--strict-markers"]

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "c8e1f5f25802924e92f4f7f41851c9669778359e" }
