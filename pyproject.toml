[project]
name = "kivyx"
version = "0.1.0.dev0"
description = "A new set of Kivy widgets that aims for better touch experience"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nattosai Mito", email = "flow4re2c@gmail.com" }
]
keywords = ["kivy"]
classifiers=[
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "asynckivy>=0.11",
    "kivy",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
doc = [
    "sphinx==8.2.3",
]

[tool.pytest]
xfail_strict = true
addopts = ["--maxfail=4", "--strict-markers"]

[tool.uv.sources]
kivy = { git = "https://github.com/kivy/kivy", rev = "be90b9f4bdb28c734e1cc01d6e7a7e1440e5216e" }
